<!DOCTYPE html>
<html lang="fr">

<!-- ====================================================== -->
<!--                  HEAD / EN-TETE HTML                   -->
<!-- ====================================================== -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rejoignez Botova et créez votre espace personnel.">
    <title>Inscription - Botova.dev</title>

    <!-- Fonts / Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheets / Feuilles de style -->
    <link rel="stylesheet" href="../../../css/base/global.css">
    <link rel="stylesheet" href="../../../css/components/header.css">
    <link rel="stylesheet" href="../../../css/components/navbar.css">
    <link rel="stylesheet" href="../../../css/components/dropdown.css">
    <link rel="stylesheet" href="../../../css/components/footer.css">
    <link rel="stylesheet" href="../../../css/pages/account/account.css">
    <link rel="stylesheet" href="../../../css/base/responsive.css">
    <link rel="stylesheet" href="../../../css/pages/account/responsive.css">

    <!-- JavaScript / Scripts -->
    <script type="module" src="../../../js/account/account-page.js"></script>
</head>
<body class="account-page" data-page="account" data-account-page="register">

    <!-- ====================================================== -->
    <!--                HEADER / EN-TETE DU SITE                -->
    <!-- ====================================================== -->

    <header class="site-header" id="site-header" data-include="html/components/header.html"></header>

    <!-- ====================================================== -->
    <!--             REGISTER / PAGE D'INSCRIPTION              -->
    <!-- ====================================================== -->

    <main class="account-main" id="main-content">
        <section class="account-content" aria-labelledby="register-title">
            <h1 class="account-title" id="register-title">Rejoindre Botova</h1>
            <p class="account-description">Créez votre compte pour accéder à votre espace personnel.</p>

            <!-- ====================================================== -->
            <!--        REGISTER FORM / FORMULAIRE INSCRIPTION          -->
            <!-- ====================================================== -->

            <form class="account-form" data-account-form="register" novalidate>
                <div class="account-grid">
                    <div class="account-field">
                        <label for="register-last-name">Nom</label>
                        <input id="register-last-name" name="lastName" type="text" placeholder="Saisissez votre nom" autocomplete="family-name" maxlength="80" required>
                    </div>

                    <div class="account-field">
                        <label for="register-first-name">Prénom</label>
                        <input id="register-first-name" name="firstName" type="text" placeholder="Saisissez votre prénom" autocomplete="given-name" maxlength="80" required>
                    </div>

                    <div class="account-field">
                        <label for="register-email">Adresse e-mail</label>
                        <input id="register-email" name="email" type="email" placeholder="Saisissez votre adresse e-mail" autocomplete="email" maxlength="254" required>
                    </div>

                    <div class="account-field">
                        <label for="register-password">Mot de passe</label>
                        <input id="register-password" name="password" type="password" placeholder="••••••••••••" autocomplete="new-password" minlength="8" required>
                    </div>
                </div>

                <!-- ====================================================== -->
                <!--         REGISTER ACTION / CREATION DU COMPTE           -->
                <!-- ====================================================== -->

                <div class="account-action-card account-register-card">
                    <div class="account-action-text">
                        <h2>Votre prochaine étape</h2>
                        <p>Vérifiez les informations saisies avant de créer votre compte.</p>
                    </div>

                    <div class="account-action-buttons">
                        <button class="account-button account-button-primary" type="submit">Créer mon compte</button>
                        <a class="account-button account-button-secondary" href="../">Déjà inscrit ?</a>
                    </div>
                </div>

                <p class="account-status" data-account-status role="status" aria-live="polite" tabindex="-1" hidden></p>
            </form>
        </section>
    </main>

    <!-- ====================================================== -->
    <!--                 FOOTER / PIED DE PAGE                  -->
    <!-- ====================================================== -->

    <footer class="site-footer" id="site-footer" data-include="html/components/footer.html"></footer>
</body>
</html>
