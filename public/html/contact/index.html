<!DOCTYPE html>
<html lang="fr">

<!-- ====================================================== -->
<!--                  HEAD / EN-TETE HTML                   -->
<!-- ====================================================== -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contactez Botova pour nous présenter votre projet, vos idées et vos besoins.">
    <title>Contact - Botova.dev</title>

    <!-- Fonts / Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheets / Feuilles de style -->
    <link rel="stylesheet" href="../../css/base/global.css">
    <link rel="stylesheet" href="../../css/components/header.css">
    <link rel="stylesheet" href="../../css/components/navbar.css">
    <link rel="stylesheet" href="../../css/components/dropdown.css">
    <link rel="stylesheet" href="../../css/components/footer.css">
    <link rel="stylesheet" href="../../css/pages/contact/contact.css">
    <link rel="stylesheet" href="../../css/base/responsive.css">
    <link rel="stylesheet" href="../../css/pages/contact/responsive.css">

    <!-- JavaScript / Scripts -->
    <script type="module" src="../../js/contact/contact-page.js"></script>
</head>

<body class="contact-page" data-page="contact">

    <!-- ====================================================== -->
    <!--                HEADER / EN-TETE DU SITE                -->
    <!-- ====================================================== -->

    <header class="site-header" id="site-header" data-include="html/components/header.html"></header>

    <!-- ====================================================== -->
    <!--            MAIN CONTENT / CONTENU PRINCIPAL            -->
    <!-- ====================================================== -->

    <main class="contact-main" id="main-content">
        <section class="contact-section" aria-labelledby="contact-page-title">
            <h1 class="contact-title" id="contact-page-title">Contact</h1>
            <p class="contact-description">
                Présentez-nous votre projet et vos besoins.<br>
                Les champs marqués d’un astérisque (*) sont obligatoires.
            </p>

            <!-- ====================================================== -->
            <!--            CONTACT FORM / FORMULAIRE CONTACT           -->
            <!-- ====================================================== -->

            <form class="contact-form" id="contact-form" novalidate>

                <div class="contact-fields">
                    <div class="contact-field">
                        <label for="contact-name">Votre nom *</label>
                        <input type="text" id="contact-name" name="name" placeholder="Nom et prénom" autocomplete="name" maxlength="120" required>
                    </div>

                    <div class="contact-field">
                        <label for="contact-email">Votre e-mail *</label>
                        <input type="email" id="contact-email" name="email" placeholder="nom@exemple.fr" autocomplete="email" maxlength="254" required>
                    </div>

                    <div class="contact-field">
                        <label for="contact-subject">Objet de la demande *</label>
                        <input type="text" id="contact-subject" name="subject" placeholder="Indiquez votre besoin" maxlength="200" required>
                    </div>

                    <div class="contact-field">
                        <label for="contact-message">Votre message *</label>
                        <textarea id="contact-message" name="message" placeholder="Décrivez votre projet, vos contraintes et vos attentes." rows="4" maxlength="5000" required></textarea>
                    </div>
                </div>

                <!-- ====================================================== -->
                <!--              SEND MESSAGE / ENVOI MESSAGE              -->
                <!-- ====================================================== -->

                <h2 class="contact-subtitle">Envoyer votre demande</h2>

                <div class="contact-send-card">
                    <div class="contact-send-text">
                        <h3>Votre prochaine étape :</h3>
                        <p>Vérifiez votre message et vos informations avant l’envoi.</p>
                    </div>

                    <button class="contact-send-button" type="submit">Envoyer le message</button>
                </div>

                <p class="contact-form-status" id="contact-form-status" role="status" aria-live="polite" tabindex="-1" hidden></p>
            </form>
        </section>
    </main>

    <!-- ====================================================== -->
    <!--                 FOOTER / PIED DE PAGE                  -->
    <!-- ====================================================== -->

    <footer class="site-footer" id="site-footer" data-include="html/components/footer.html"></footer>
</body>
</html>
